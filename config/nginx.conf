server {
    # 1. UBAH PORT: Ganti 80 menjadi 81
    # Karena kita akan pakai network host, NGINX harus listen langsung di port target
    listen 81 default_server;
    listen [::]:81 default_server;

    root /var/www/html/public;
    index index.php index.html index.htm;
    server_name _;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        
        fastcgi_index index.php;
        include fastcgi_params;

        # --- PERBAIKAN DI SINI ---
        
        # 2. HAPUS ATAU KOMENTARI BARIS INI:
        # fastcgi_param REMOTE_ADDR $http_x_real_ip; 
        
        # 3. GANTI DENGAN INI:
        # $remote_addr akan berisi IP asli karena kita akan pakai mode host network
        fastcgi_param REMOTE_ADDR $remote_addr; 
        
        # Sisa parameter biarkan default/standar
        fastcgi_param HTTP_HOST $http_host;
        # Hapus header forwarded jika tidak ada proxy di depan, 
        # tapi dibiarkan begini juga tidak apa-apa (opsional).
    }

    location ~ /\.ht { deny all; }
    location ~ /public/js/ { deny all; }
    location ~ /public/uploads/ { deny all; }
    location ~ /public/css/ { deny all; }
}